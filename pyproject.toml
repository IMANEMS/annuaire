[project]
name = "annuaire"
version = "0.1.0"
description = "Récupère, nettoie et analyse l'annuaire des établissements scolaires de l'Éducation nationale."
readme = "README.md"
authors = [
    { name = "Imane MOHAMMED SEGHIR", email = "126501086+IMANEMS@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
]

[project.scripts]
annuaire-ingest = "annuaire.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "mypy>=2.3.1",
    "ruff>=0.16.8",
    "types-requests>=2.33.0.20260906",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["pandas.*", "pyarrow.*"]
ignore_missing_imports = true
